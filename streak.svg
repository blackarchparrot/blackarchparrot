<svg xmlns="http://www.w3.org/2000/svg"
     width="600"
     height="220"
     viewBox="0 0 600 220">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Fire Gradient -->
    <linearGradient id="fireGrad"
                    x1="0%" y1="100%"
                    x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ====================================== -->
  <!-- MAIN CARD -->
  <!-- ====================================== -->

  <rect x="1"
        y="1"
        width="598"
        height="218"
        rx="12"
        fill="url(#bg)"
        stroke="url(#borderGrad)"
        stroke-width="1.5"/>


  <!-- ====================================== -->
  <!-- SUBTLE CENTER GLOW -->
  <!-- ====================================== -->

  <circle cx="300"
          cy="100"
          r="45"
          fill="#f0883e"
          opacity="0.05"
          filter="url(#glow)"/>


  <!-- ====================================== -->
  <!-- HEADER -->
  <!-- ====================================== -->

  <text x="300"
        y="38"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="15"
        font-weight="600"
        letter-spacing="1"
        fill="#c9d1d9"
        text-anchor="middle">
    GITHUB STREAK
  </text>


  <!-- Header Divider -->

  <line x1="30"
        y1="52"
        x2="570"
        y2="52"
        stroke="#30363d"
        stroke-width="1"/>


  <!-- ====================================== -->
  <!-- TOTAL CONTRIBUTIONS -->
  <!-- ====================================== -->

  <text x="105"
        y="78"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#8b949e"
        text-anchor="middle">
    TOTAL CONTRIBUTIONS
  </text>

  <text x="105"
        y="108"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#f0f6fc"
        text-anchor="middle">
    1,327
  </text>


  <!-- ====================================== -->
  <!-- DIVIDER -->
  <!-- ====================================== -->

  <line x1="200"
        y1="65"
        x2="200"
        y2="120"
        stroke="#30363d"
        stroke-width="1"/>


  <!-- ====================================== -->
  <!-- LONGEST STREAK -->
  <!-- ====================================== -->

  <text x="300"
        y="78"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#8b949e"
        text-anchor="middle">
    LONGEST STREAK
  </text>


  <!-- Flame -->

  <path d="M268 108
           C264 105 262 102 262 98
           C262 95 264 93 266 91
           C266 95 268 97 269 96
           C271 94 270 91 268 89
           C273 91 276 95 276 99
           C276 104 272 108 268 108 Z"
        fill="url(#fireGrad)"
        filter="url(#glow)"/>


  <!-- Longest Streak Number -->

  <text x="300"
        y="108"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="url(#fireGrad)"
        text-anchor="middle">
    28
  </text>

  <text x="300"
        y="126"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        fill="#8b949e"
        text-anchor="middle">
    DAYS
  </text>


  <!-- ====================================== -->
  <!-- DIVIDER -->
  <!-- ====================================== -->

  <line x1="400"
        y1="65"
        x2="400"
        y2="120"
        stroke="#30363d"
        stroke-width="1"/>


  <!-- ====================================== -->
  <!-- CURRENT STREAK -->
  <!-- ====================================== -->

  <text x="500"
        y="78"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#8b949e"
        text-anchor="middle">
    CURRENT STREAK
  </text>

  <text x="500"
        y="108"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#f0f6fc"
        text-anchor="middle">
    13
  </text>

  <text x="500"
        y="126"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        fill="#8b949e"
        text-anchor="middle">
    DAYS
  </text>


  <!-- ====================================== -->
  <!-- BOTTOM DIVIDER -->
  <!-- ====================================== -->

  <line x1="30"
        y1="145"
        x2="570"
        y2="145"
        stroke="#30363d"
        stroke-width="1"/>


  <!-- ====================================== -->
  <!-- ACTIVE DAYS -->
  <!-- ====================================== -->

  <text x="150"
        y="173"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="0.8"
        fill="#8b949e"
        text-anchor="middle">
    ACTIVE DAYS
  </text>

  <text x="150"
        y="198"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#f0f6fc"
        text-anchor="middle">
    345
  </text>


  <!-- ====================================== -->
  <!-- BOTTOM DIVIDER -->
  <!-- ====================================== -->

  <line x1="280"
        y1="158"
        x2="280"
        y2="202"
        stroke="#30363d"
        stroke-width="1"/>


  <!-- ====================================== -->
  <!-- BADGE 1 -->
  <!-- ====================================== -->

  <rect x="300"
        y="158"
        width="130"
        height="20"
        rx="10"
        fill="#58a6ff"
        fill-opacity="0.10"
        stroke="#58a6ff"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="365"
        y="172"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        fill="#58a6ff"
        text-anchor="middle">
    Active Learner
  </text>


  <!-- ====================================== -->
  <!-- BADGE 2 -->
  <!-- ====================================== -->

  <rect x="440"
        y="158"
        width="100"
        height="20"
        rx="10"
        fill="#58a6ff"
        fill-opacity="0.10"
        stroke="#58a6ff"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="490"
        y="172"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        fill="#58a6ff"
        text-anchor="middle">
    Developer
  </text>


  <!-- ====================================== -->
  <!-- RESEARCHER BADGE -->
  <!-- ====================================== -->

  <rect x="365"
        y="185"
        width="100"
        height="20"
        rx="10"
        fill="#58a6ff"
        fill-opacity="0.10"
        stroke="#58a6ff"
        stroke-opacity="0.35"
        stroke-width="1"/>

  <text x="415"
        y="199"
        font-family="Segoe UI, Ubuntu, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        fill="#58a6ff"
        text-anchor="middle">
    Researcher
  </text>


  <!-- ====================================== -->
  <!-- CORNER ACCENTS -->
  <!-- ====================================== -->

  <circle cx="20"
          cy="20"
          r="1.5"
          fill="#f0883e"
          opacity="0.7"/>

  <circle cx="580"
          cy="20"
          r="1.5"
          fill="#58a6ff"
          opacity="0.7"/>

</svg>
