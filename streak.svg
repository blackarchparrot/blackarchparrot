<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Flame & Streak Accent Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Card Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #c9d1d9; letter-spacing: 1px; }
      .label { font: 600 10px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #8b949e; letter-spacing: 0.8px; }
      .value { font: 700 28px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #f0f6fc; }
      .unit { font: 500 10px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #8b949e; }
      .tag { font: 500 11px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #58a6ff; }
      .highlight { fill: url(#fireGrad); }

      /* Subtle Hover Scale & Border Glow Effects */
      .card {
        transform-origin: center;
        transition: transform 0.3s ease, stroke 0.3s ease;
      }
      svg:hover .card {
        stroke: url(#borderGrad);
      }
      .flame {
        transform-origin: 268px 108px;
        animation: float 2.5s ease-in-out infinite alternate;
      }
      .pulse-glow {
        animation: pulse 2s ease-in-out infinite alternate;
      }

      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-3px) scale(1.05); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect class="card" width="598" height="218" x="1" y="1" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Background Glow Accents -->
  <circle cx="295" cy="100" r="45" fill="#f0883e" opacity="0.06" filter="url(#glow)" />

  <!-- Header -->
  <text x="300" y="38" class="title" text-anchor="middle">GITHUB STREAK</text>
  <line x1="30" y1="52" x2="570" y2="52" stroke="#30363d" stroke-width="1" stroke-linecap="round" />

  <!-- SECTION 1: TOTAL CONTRIBUTIONS -->
  <g transform="translate(105, 0)">
    <text y="78" class="label" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
    <text y="108" class="value" text-anchor="middle">1,327</text>
  </g>

  <!-- Divider 1 -->
  <line x1="200" y1="65" x2="200" y2="120" stroke="#30363d" stroke-width="1" stroke-linecap="round" />

  <!-- SECTION 2: LONGEST STREAK (Main Focus) -->
  <g transform="translate(295, 0)">
    <text y="78" class="label" text-anchor="middle">LONGEST STREAK</text>
    
    <!-- Vector Flame Icon -->
    <path class="flame" fill="url(#fireGrad)" filter="url(#glow)" d="M265.5,108 C265.5,108 262,103 262,99.5 C262,97 264,95 266,93 C266.5,95.5 268,96.5 269,96 C270.5,95 270,91.5 268,89 C272,90.5 275,94 275,98.5 C275,103.5 270.5,108 265.5,108 Z" />
    
    <!-- Pulse Effect Under Number -->
    <text y="108" class="value highlight pulse-glow" text-anchor="middle" filter="url(#glow)" opacity="0.5">28</text>
    <text y="108" class="value highlight" text-anchor="middle">28</text>
    <text y="126" class="unit" text-anchor="middle">DAYS</text>
  </g>

  <!-- Divider 2 -->
  <line x1="390" y1="65" x2="390" y2="120" stroke="#30363d" stroke-width="1" stroke-linecap="round" />

  <!-- SECTION 3: CURRENT STREAK -->
  <g transform="translate(485, 0)">
    <text y="78" class="label" text-anchor="middle">CURRENT STREAK</text>
    <text y="108" class="value" text-anchor="middle">13</text>
    <text y="126" class="unit" text-anchor="middle">DAYS</text>
  </g>

  <!-- Bottom Divider -->
  <line x1="30" y1="145" x2="570" y2="145" stroke="#30363d" stroke-width="1" stroke-linecap="round" />

  <!-- SECTION 4: ACTIVE DAYS & TAGS -->
  <g transform="translate(150, 0)">
    <text y="173" class="label" text-anchor="middle">ACTIVE DAYS</text>
    <text y="198" class="value" font-size="22" text-anchor="middle">345</text>
  </g>

  <!-- Vertical Divider Bottom -->
  <line x1="280" y1="158" x2="280" y2="202" stroke="#30363d" stroke-width="1" stroke-linecap="round" />

  <!-- Tags / Badges -->
  <g transform="translate(410, 162)">
    <!-- Pill 1 -->
    <rect x="-65" y="0" width="130" height="20" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="14" class="tag" text-anchor="middle">⚡ Active Learner</text>
    
    <!-- Pill 2 -->
    <rect x="75" y="0" width="100" height="20" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="125" y="14" class="tag" text-anchor="middle">💻 Developer</text>
  </g>

  <!-- Decorative Corner Accents -->
  <circle cx="20" cy="20" r="1.5" fill="#f0883e" opacity="0.5" />
  <circle cx="580" cy="20" r="1.5" fill="#58a6ff" opacity="0.5" />
</svg>
