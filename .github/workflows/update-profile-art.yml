name: Update Profile Artwork & Heatmap

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-ci.txt

      - name: Fetch Latest GitHub Contributions
        run: python scripts/fetch_contributions.py blackarchparrot

      - name: Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(art): auto-update daily contribution heatmap [skip ci]"
            git push
          fi
